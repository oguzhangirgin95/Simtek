# PREPROD ortami
# Calistirma: java -jar backend.jar --spring.profiles.active=preprod
# Gizli degerler sunucudaki ortam degiskenlerinden okunur, dosyada tutulmaz.

app.cors.allowed-origins=https://preprod.simtek.local

# ---- Sifreleme ----
# Frontend environment.preprod.ts icindeki cryptoKey ile AYNI olmali
app.crypto.key=${SIMTEK_CRYPTO_KEY}

# ---- Veritabani ----
spring.datasource.url=jdbc:postgresql://preprod-db.simtek.local:5432/simtek
spring.datasource.username=${SIMTEK_DB_USER}
spring.datasource.password=${SIMTEK_DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

spring.jpa.show-sql=false
