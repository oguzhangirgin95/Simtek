# PROD ortami
# Calistirma: java -jar backend.jar --spring.profiles.active=prod
# Gizli degerler sunucudaki ortam degiskenlerinden okunur, dosyada tutulmaz.
# Eksik olan bir deger varsa uygulama acilista hata verir; sessizce yanlis calismaz.

app.cors.allowed-origins=https://simtek.local

# ---- Sifreleme ----
# Frontend environment.prod.ts icindeki cryptoKey ile AYNI olmali
app.crypto.key=${SIMTEK_CRYPTO_KEY}

# ---- Veritabani ----
spring.datasource.url=${SIMTEK_DB_URL}
spring.datasource.username=${SIMTEK_DB_USER}
spring.datasource.password=${SIMTEK_DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10

spring.jpa.show-sql=false
