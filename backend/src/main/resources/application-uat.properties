
app.cors.allowed-origins=https://uat.simtek.local

app.crypto.key=SimtekUatKey0123456789ABCDEF!!!!

spring.datasource.url=jdbc:postgresql://uat-db.simtek.local:5432/simtek
spring.datasource.username=${SIMTEK_DB_USER:simtek_uat}
spring.datasource.password=${SIMTEK_DB_PASSWORD:simtek_uat}

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3

spring.jpa.show-sql=false
