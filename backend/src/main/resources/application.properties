spring.application.name=backend

app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost:4000

app.crypto.key=SimtekLocalKey0123456789ABCDEF!!

spring.datasource.url=jdbc:postgresql://localhost:5432/simtek
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Keycloak. Token dogrulamasi icin gereken tek ayar.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/simtek}
app.keycloak.client-id=${KEYCLOAK_CLIENT_ID:simtek-frontend}
