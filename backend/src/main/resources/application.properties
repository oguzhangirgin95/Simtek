# Bu dosya ORTAK ayarlari ve yerel gelistirme degerlerini tutar.
# Diger ortamlar uzerine biner:  --spring.profiles.active=test|uat|preprod|prod
spring.application.name=backend

# Frontend adresleri: ng serve ve ssr sunucusu
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost:4000

# ---- Sifreleme ----
# Frontend'deki environment.cryptoKey ile AYNI olmali, 32 karakter (AES-256)
app.crypto.key=SimtekLocalKey0123456789ABCDEF!!

# ---- Veritabani ----
spring.datasource.url=jdbc:postgresql://localhost:5432/simtek
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Baglanti havuzu
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Sema Flyway ile yonetilir; JPA sadece dogrular, tablo olusturmaz
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.show-sql=false

# ---- Versiyonlu scriptler ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
