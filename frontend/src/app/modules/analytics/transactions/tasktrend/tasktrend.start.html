<h2>{{ labels().title }}</h2>

<div class="filters">
  <app-select
    id="cityId"
    [label]="labels().city"
    [placeholder]="labels().all"
    [options]="State.CityList ?? []"
    [ngModel]="State.Request.cityId"
    (ngModelChange)="setFilter('cityId', $event)"
  />
  <app-select
    id="unitId"
    [label]="labels().unit"
    [placeholder]="labels().all"
    [options]="State.UnitList ?? []"
    [ngModel]="State.Request.unitId"
    (ngModelChange)="setFilter('unitId', $event)"
  />
</div>

<div class="stats">
  <app-statcard [label]="labels().scope" [value]="State.Trend?.cityName ?? '-'" />
  <app-statcard [label]="labels().totalTask" [value]="State.Trend?.totalTaskCount ?? 0" />
  <app-statcard [label]="labels().averageTask" [value]="State.Trend?.averageTaskCount ?? 0" variant="success" />
</div>

<div class="panels">
  <app-card [title]="labels().trendTitle">
    <app-barchart [items]="State.TrendChart ?? []" />
  </app-card>

  <app-card [title]="labels().typeChartTitle">
    <app-donutchart [items]="State.TypeChart ?? []" />
  </app-card>
</div>

<app-card [title]="labels().trendTitle">
  <app-grid [columns]="columns()" [rows]="State.Trend?.points ?? []" />
</app-card>
