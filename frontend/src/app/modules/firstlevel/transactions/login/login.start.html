<div class="login-form">
  <h2>{{ title() }}</h2>

  <app-input id="username" [label]="usernameLabel()" [(ngModel)]="State.Request.username" />

  <app-input id="password" type="password" [label]="passwordLabel()" [(ngModel)]="State.Request.password" />

  @if (State.loginError) {
    <p class="error">{{ State.loginError }}</p>
  }

  <div class="buttons">
    <button type="button" (click)="login()">{{ loginButton() }}</button>
  </div>
</div>
