<div class="login-form">
  <h2>{{ title() }}</h2>

  <app-input
    id="username"
    [label]="usernameLabel()"
    [value]="State.Request?.username ?? ''"
    (valueChange)="setField('username', $event)"
  />

  <app-input
    id="password"
    type="password"
    [label]="passwordLabel()"
    [value]="State.Request?.password ?? ''"
    (valueChange)="setField('password', $event)"
  />

  @if (State.loginError) {
    <p class="error">{{ State.loginError }}</p>
  }

  <div class="buttons">
    <button type="button" (click)="login()">{{ loginButton() }}</button>
  </div>
</div>
