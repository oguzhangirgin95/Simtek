<h2>{{ title() }}</h2>

<div class="field">
  <label for="username">{{ usernameLabel() }}</label>
  <input id="username" type="text" [value]="State.Request?.username ?? ''" (input)="setField('username', $event)" />
</div>

<div class="field">
  <label for="password">{{ passwordLabel() }}</label>
  <input id="password" type="password" [value]="State.Request?.password ?? ''" (input)="setField('password', $event)" />
</div>

@if (errors()?.length) {
  <ul class="errors">
    @for (error of errors(); track $index) {
      <li>{{ error.message }}</li>
    }
  </ul>
}

@if (State.loginError) {
  <p class="error">{{ State.loginError }}</p>
}

<div class="buttons">
  <button type="button" (click)="login()">{{ loginButton() }}</button>
</div>
