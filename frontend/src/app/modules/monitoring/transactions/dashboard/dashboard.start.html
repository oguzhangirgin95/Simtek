<div class="page-head">
  <h2>{{ labels().title }}</h2>

  @if (State.MapStatistics?.busiestCityName) {
    <span class="page-head__hint">
      {{ labels().busiest }}: <b>{{ State.MapStatistics.busiestCityName }}</b>
      ({{ State.MapStatistics.busiestCityActivePolice }})
    </span>
  }
</div>

<div class="filters">
  <app-select
    id="cityId"
    [label]="labels().city"
    [placeholder]="labels().all"
    [options]="State.CityList ?? []"
    [ngModel]="State.Request.cityId"
    (ngModelChange)="setFilter('cityId', $event)"
  />
  <app-select
    id="unitId"
    [label]="labels().unit"
    [placeholder]="labels().all"
    [options]="State.UnitList ?? []"
    [ngModel]="State.Request.unitId"
    (ngModelChange)="setFilter('unitId', $event)"
  />
  <app-select
    id="status"
    [label]="labels().status"
    [placeholder]="labels().all"
    [options]="State.StatusList ?? []"
    [ngModel]="State.Request.status"
    (ngModelChange)="setFilter('status', $event)"
  />
</div>

<div class="stats" id="dashboardStats">
  <app-statcard [label]="labels().totalPolice" [value]="State.Summary?.totalPolice ?? 0" clickable (clicked)="selectMetric({ titleKey: 'mapTotalTitle' })" />
  <app-statcard [label]="labels().onDuty" [value]="State.Summary?.onDuty ?? 0" variant="success" clickable (clicked)="selectMetric({ titleKey: 'mapTotalActiveTitle', status: 'SAHADA', variant: 'success' })" />
  <app-statcard [label]="labels().atStation" [value]="State.Summary?.atStation ?? 0" variant="teal" clickable (clicked)="selectMetric({ titleKey: 'mapTotalCentralTitle', status: 'MERKEZDE', variant: 'teal' })" />
  <app-statcard [label]="labels().onLeave" [value]="State.Summary?.onLeave ?? 0" variant="warning" clickable (clicked)="selectMetric({ titleKey: 'mapTotalLeaveTitle', status: 'IZINDE', variant: 'warning' })" />
  <app-statcard [label]="labels().onReport" [value]="State.Summary?.onReport ?? 0" variant="violet" clickable (clicked)="selectMetric({ titleKey: 'mapTotalReportTitle', status: 'RAPORLU', variant: 'violet' })" />
  <app-statcard [label]="labels().overLimit" [value]="State.Summary?.overDailyLimit ?? 0" variant="error" clickable (clicked)="selectMetric({ titleKey: 'mapTotalOverlimitTitle', field: 'overLimitPolice', variant: 'error' })" />
</div>

<div class="panels">
  <app-card id="dashboardMap" [title]="mapTitle()" [subtitle]="labels().mapHint">
    <app-unity
      [data]="{ points: State.MapPoints ?? [], selectedId: State.Request.cityId, variant: State.MapMetric?.variant ?? '' }"
      (message)="setFilter('cityId', $event)"
    />
  </app-card>

  <app-card [title]="labels().statusChartTitle">
    <app-donutchart [items]="State.StatusChart ?? []" />
    <app-donutchart [title]="labels().limitChartTitle" [items]="State.LimitChart ?? []" />
  </app-card>
</div>

<app-card
  id="dashboardUnits"
  [title]="(State.UnitWorkload?.cityName ?? '') + ' ' + labels().unitWorkloadTitle"
  [subtitle]="unitActionText()"
>
  <app-barchart [items]="State.UnitChart ?? []" />
  <app-genericlist [config]="unitListConfig()" [rows]="State.UnitWorkload?.units ?? []" />
</app-card>

<app-card>
  <app-documentview [config]="unitDocumentConfig()" [rows]="State.UnitWorkload?.units ?? []" />
</app-card>
