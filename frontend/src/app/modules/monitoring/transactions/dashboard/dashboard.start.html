<h2>{{ labels().title }}</h2>

<div class="filters">
  <app-select
    name="cityId"
    [label]="labels().city"
    [placeholder]="labels().all"
    [value]="State.Request?.cityId"
    [options]="State.CityList ?? []"
    (valueChange)="setFilter('cityId', $event)"
  />
  <app-select
    name="unitId"
    [label]="labels().unit"
    [placeholder]="labels().all"
    [value]="State.Request?.unitId"
    [options]="State.UnitList ?? []"
    (valueChange)="setFilter('unitId', $event)"
  />
  <app-select
    name="status"
    [label]="labels().status"
    [placeholder]="labels().all"
    [value]="State.Request?.status"
    [options]="State.StatusList ?? []"
    (valueChange)="setFilter('status', $event)"
  />
</div>

<div class="stats">
  <app-statcard [label]="labels().totalPolice" [value]="State.Summary?.totalPolice ?? 0" />
  <app-statcard [label]="labels().onDuty" [value]="State.Summary?.onDuty ?? 0" variant="success" />
  <app-statcard [label]="labels().atStation" [value]="State.Summary?.atStation ?? 0" />
  <app-statcard [label]="labels().onLeave" [value]="State.Summary?.onLeave ?? 0" variant="warning" />
  <app-statcard [label]="labels().onReport" [value]="State.Summary?.onReport ?? 0" variant="warning" />
  <app-statcard [label]="labels().overLimit" [value]="State.Summary?.overDailyLimit ?? 0" variant="error" />
</div>

<div class="panels">
  <app-card [title]="labels().mapTitle">
    <app-map [points]="State.MapPoints ?? []" [selectedId]="State.Request?.cityId" (pointClicked)="selectCity($event)" />
  </app-card>

  <app-card [title]="labels().statusChartTitle">
    <app-donutchart [items]="State.StatusChart ?? []" />
  </app-card>
</div>

<app-card [title]="(State.UnitWorkload?.cityName ?? '') + ' ' + labels().unitWorkloadTitle">
  <app-barchart [items]="State.UnitChart ?? []" />
  <app-grid
    [columns]="unitColumns()"
    [rows]="State.UnitWorkload?.units ?? []"
    [emptyText]="labels().emptyUnit"
  />
</app-card>
