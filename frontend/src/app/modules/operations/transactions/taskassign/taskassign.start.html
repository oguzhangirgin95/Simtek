<h2>{{ labels().title }}</h2>

<app-card [title]="labels().formTitle" [subtitle]="labels().hint">
  <div class="filters">
    <app-select
      name="cityId"
      [label]="labels().city"
      [placeholder]="labels().all"
      [value]="State.Filter?.cityId"
      [options]="State.CityList ?? []"
      (valueChange)="setFilter('cityId', $event)"
    />
    <app-select
      name="unitId"
      [label]="labels().unit"
      [placeholder]="labels().all"
      [value]="State.Filter?.unitId"
      [options]="State.UnitList ?? []"
      (valueChange)="setFilter('unitId', $event)"
    />
  </div>

  <div class="filters">
    <app-select
      name="policeId"
      [label]="labels().police"
      [placeholder]="labels().all"
      [value]="State.Request?.policeId"
      [options]="State.PoliceList ?? []"
      (valueChange)="setField('policeId', $event)"
    />
    <app-select
      name="type"
      [label]="labels().type"
      [placeholder]="labels().all"
      [value]="State.Request?.type"
      [options]="State.TypeList ?? []"
      (valueChange)="setField('type', $event)"
    />
    <app-input
      name="location"
      [label]="labels().location"
      [value]="State.Request?.location"
      (valueChange)="setField('location', $event)"
    />
    <app-input
      name="startTime"
      [label]="labels().startTime"
      [value]="State.Request?.startTime"
      (valueChange)="setField('startTime', $event)"
    />
    <app-input
      name="endTime"
      [label]="labels().endTime"
      [value]="State.Request?.endTime"
      (valueChange)="setField('endTime', $event)"
    />
  </div>

  @if (errors()?.length) {
    <ul class="errors">
      @for (error of errors(); track $index) {
        <li>{{ error.message }}</li>
      }
    </ul>
  }
</app-card>
