<h2>{{ labels().title }}</h2>

<app-card [title]="labels().formTitle" [subtitle]="labels().hint">
  <div class="filters">
    <app-select
      id="cityId"
      [label]="labels().city"
      [placeholder]="labels().all"
      [options]="State.CityList ?? []"
      [ngModel]="State.Filter.cityId"
      (ngModelChange)="setFilter('cityId', $event)"
    />
    <app-select
      id="unitId"
      [label]="labels().unit"
      [placeholder]="labels().all"
      [options]="State.UnitList ?? []"
      [ngModel]="State.Filter.unitId"
      (ngModelChange)="setFilter('unitId', $event)"
    />
  </div>

  <div class="filters">
    <app-select
      id="policeId"
      [label]="labels().police"
      [placeholder]="labels().all"
      [options]="State.PoliceList ?? []"
      [(ngModel)]="State.Request.policeId"
    />
    <app-select
      id="type"
      [label]="labels().type"
      [placeholder]="labels().all"
      [options]="State.TypeList ?? []"
      [(ngModel)]="State.Request.type"
    />
    <app-input id="location" [label]="labels().location" [(ngModel)]="State.Request.location" />
    <app-input id="startTime" [label]="labels().startTime" [(ngModel)]="State.Request.startTime" />
    <app-input id="endTime" [label]="labels().endTime" [(ngModel)]="State.Request.endTime" />
  </div>
</app-card>
