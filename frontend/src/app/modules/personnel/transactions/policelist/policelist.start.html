<h2>{{ labels().title }}</h2>

<div class="filters">
  <app-select
    id="cityId"
    [label]="labels().city"
    [placeholder]="labels().all"
    [options]="State.CityList ?? []"
    [ngModel]="State.Request.cityId"
    (ngModelChange)="setFilter('cityId', $event)"
  />
  <app-select
    id="unitId"
    [label]="labels().unit"
    [placeholder]="labels().all"
    [options]="State.UnitList ?? []"
    [ngModel]="State.Request.unitId"
    (ngModelChange)="setFilter('unitId', $event)"
  />
  <app-select
    id="status"
    [label]="labels().status"
    [placeholder]="labels().all"
    [options]="State.StatusList ?? []"
    [ngModel]="State.Request.status"
    (ngModelChange)="setFilter('status', $event)"
  />
  <app-input
    id="searchText"
    [label]="labels().search"
    [ngModel]="State.Request.searchText"
    (ngModelChange)="setFilter('searchText', $event)"
  />
  <app-button [label]="labels().clear" variant="outline" (clicked)="clearFilter()" />
</div>

<app-card [title]="labels().listTitle + ' (' + (State.TotalCount ?? 0) + ')'" [subtitle]="labels().listHint">
  <app-grid
    [columns]="columns()"
    [rows]="State.PoliceList ?? []"
    [emptyText]="labels().emptyList"
    clickable
    (rowClicked)="selectPolice($event)"
  />
  <app-pagination
    [totalCount]="State.TotalCount ?? 0"
    [pageNumber]="State.Request.pageNumber"
    [pageSize]="State.Request.pageSize"
    (pageNumberChange)="setPage($event)"
  />
</app-card>

<app-modal
  [open]="!!State.SelectedPoliceId"
  [title]="State.PoliceDetail?.fullName ?? labels().detailTitle"
  (openChange)="closeDetail()"
>
  <app-detailcard
    [title]="State.PoliceDetail?.fullName"
    [subtitle]="State.PoliceDetail?.rank"
    [imageUrl]="State.PoliceDetail?.photoUrl"
  />

  @if (State.PoliceDetail?.overDailyLimit) {
    <app-info [message]="labels().overLimit" variant="error" />
  }

  <app-tabs [tabs]="tabs()" [(active)]="State.ActiveTab" />

  @switch (State.ActiveTab) {
    @case ('arac') {
      @if (State.VehicleDetail?.found) {
        <app-detailcard
          [title]="State.VehicleDetail?.plate"
          [subtitle]="State.VehicleDetail?.brand + ' ' + State.VehicleDetail?.model"
          [imageUrl]="State.VehicleDetail?.photoUrl"
          [items]="State.VehicleItems ?? []"
        />
      } @else {
        <app-info [message]="labels().noVehicle" variant="warning" />
      }
    }
    @case ('gorev') {
      <app-grid [columns]="taskColumns()" [rows]="State.TaskList ?? []" [emptyText]="labels().emptyTask" />
    }
    @default {
      <app-list [items]="State.PoliceItems ?? []" />
    }
  }
</app-modal>
