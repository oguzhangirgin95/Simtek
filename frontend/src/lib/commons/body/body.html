<main class="app-body">
  <!-- interceptor'dan gelen ortak durum -->
  @if (loading()) {
    <p class="loading">Yükleniyor...</p>
  }
  @if (serviceError()) {
    <p class="error">{{ serviceError() }}</p>
  }

  <ng-content />

  @if (!disableLayout()) {
    <div class="buttons">
      @if (showBackButton()) {
        <button type="button" (click)="back()">Geri</button>
      }
      @if (showContinueButton()) {
        <button type="button" (click)="next()">Devam</button>
      }

      @for (button of buttons(); track $index) {
        @if (isButtonVisible(button)) {
          <button type="button" (click)="clickButton(button)">{{ button.label }}</button>
        }
      }
    </div>
  }
</main>
