<div class="app-shell">
  @if (isLoggedIn()) {
    <app-menu />
  }

  <main class="app-body">
    @if (loading()) {
      <p class="loading">{{ loadingText() }}</p>
    }
    @if (serviceError()) {
      <p class="error">{{ serviceError() }}</p>
    }

    <ng-content />

    @if (!disableLayout()) {
      <div class="buttons">
        @if (showBackButton()) {
          <button type="button" (click)="back()">{{ backText() }}</button>
        }
        @if (showContinueButton()) {
          <button type="button" (click)="next()">{{ continueText() }}</button>
        }

        @for (button of buttons(); track $index) {
          @if (isButtonVisible(button)) {
            <button type="button" (click)="clickButton(button)">{{ button.label }}</button>
          }
        }
      </div>
    }
  </main>
</div>
