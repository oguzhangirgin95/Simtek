<div class="app-donutchart">
  @if (title()) {
    <h3>{{ title() }}</h3>
  }

  @if (segments().length) {
    <div class="app-donutchart__body">
      <svg viewBox="0 0 100 100" class="app-donutchart__svg">
        @for (segment of segments(); track segment.label) {
          <circle
            cx="50"
            cy="50"
            r="40"
            fill="none"
            stroke-width="14"
            [attr.stroke]="segment.color"
            [attr.stroke-dasharray]="segment.dash"
            [attr.stroke-dashoffset]="segment.offset"
            transform="rotate(-90 50 50)"
          />
        }
        <text x="50" y="54" text-anchor="middle" class="app-donutchart__total">{{ total() }}</text>
      </svg>

      <ul class="app-donutchart__legend">
        @for (segment of segments(); track segment.label) {
          <li>
            <span class="app-donutchart__dot" [style.background]="segment.color"></span>
            {{ segment.label }} — {{ segment.value }} (%{{ segment.percent }})
          </li>
        }
      </ul>
    </div>
  } @else {
    <p class="app-donutchart__empty">{{ emptyText() }}</p>
  }
</div>
