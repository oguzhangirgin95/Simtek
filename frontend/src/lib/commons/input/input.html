<div class="field">
  @if (label()) {
    <label [attr.for]="name()">{{ label() }}</label>
  }

  <input
    [id]="name()"
    [type]="type()"
    [value]="value()"
    [disabled]="disabled()"
    [class.app-input--error]="!!error()"
    (input)="onInput($event)"
  />

  @if (error()) {
    <span class="error">{{ error() }}</span>
  }
</div>
