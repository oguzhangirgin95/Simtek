<div class="field">
  @if (label()) {
    <label [attr.for]="id()">{{ label() }}</label>
  }

  <input
    [attr.id]="id()"
    [type]="type()"
    [value]="value()"
    [disabled]="disabled()"
    [class.field-error]="!!getError(id())"
    (input)="onInput($event)"
  />

  <app-validation [id]="id()" />
</div>
