<div class="app-map">
  @if (title()) {
    <h3>{{ title() }}</h3>
  }

  @if (points().length) {
    <svg viewBox="0 0 100 60" class="app-map__svg">
      @if (imageUrl()) {
        <image [attr.href]="imageUrl()" x="0" y="0" width="100" height="60" />
      }

      @for (point of points(); track point.id) {
        <g class="app-map__point" [class.app-map__point--selected]="point.id === selectedId()" (click)="pointClicked.emit(point)">
          <circle [attr.cx]="point.x" [attr.cy]="point.y" [attr.r]="radius(point.value)" />
          <text [attr.x]="point.x" [attr.y]="point.y - radius(point.value) - 1" text-anchor="middle">
            {{ point.name }} ({{ point.value }})
          </text>
        </g>
      }
    </svg>
  } @else {
    <p class="app-map__empty">{{ emptyText() }}</p>
  }
</div>
