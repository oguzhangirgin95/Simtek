<div class="app-menu">
  <button type="button" class="app-menu__toggle" (click)="toggleDrawer()">
    <span class="app-menu__bars"></span>
    {{ activeText() }}
  </button>

  @if (drawerOpen() || openCode()) {
    <div class="app-menu__backdrop" (click)="closeAll()"></div>
  }

  <nav class="app-menu__panel" [class.app-menu__panel--open]="drawerOpen()">
    <span class="app-menu__title">{{ title() }}</span>

    @for (module of modules(); track module.code) {
      <div class="app-menu__module">
        <button
          type="button"
          class="app-menu__item"
          [class.app-menu__item--active]="isModuleActive(module)"
          [class.app-menu__item--open]="openCode() === module.code"
          (click)="toggleModule(module)"
        >
          {{ module.text }}
          <span class="app-menu__arrow"></span>
        </button>

        @if (openCode() === module.code) {
          <div class="app-menu__list">
            @for (transaction of module.transactions; track transaction.path) {
              <button
                type="button"
                class="app-menu__transaction"
                [class.app-menu__transaction--active]="isActive(transaction.path)"
                (click)="go(transaction.path)"
              >
                {{ transaction.text }}
              </button>
            }
          </div>
        }
      </div>
    }
  </nav>
</div>
